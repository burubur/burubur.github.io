<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#FF2E55"/>
    </linearGradient>
  </defs>

  <!-- Dark Architectural Stage Plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0A0D12" stroke="#1E2638" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="#0E121A" stroke="url(#neonGlow)" stroke-width="1.5" opacity="0.9"/>

  <!-- 3D Wireframe Isometric CAD Prism (DRFTR Core Identity) -->
  <g>
    <!-- Top Diamond Polygon -->
    <polygon points="32 12 50 21 32 30 14 21" fill="rgba(0, 240, 255, 0.25)" stroke="#00F0FF" stroke-width="2.4" stroke-linejoin="round"/>
    
    <!-- Left Face -->
    <polygon points="14 21 32 30 32 48 14 39" fill="rgba(59, 130, 246, 0.3)" stroke="#3B82F6" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Right Face -->
    <polygon points="32 30 50 21 50 39 32 48" fill="rgba(255, 46, 85, 0.3)" stroke="#FF2E55" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Coordinate Origin Center Axis & Laser Guide -->
    <line x1="32" y1="12" x2="32" y2="48" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round"/>
    <circle cx="32" cy="30" r="2.5" fill="#00F0FF"/>
  </g>
</svg>
